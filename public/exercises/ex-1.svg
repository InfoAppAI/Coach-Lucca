<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19041C" />
      <stop offset="50%" stop-color="#2B0B2E" />
      <stop offset="100%" stop-color="#140217" />
    </linearGradient>

    <linearGradient id="gymFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1242" />
      <stop offset="100%" stop-color="#1E0720" />
    </linearGradient>

    <filter id="neonGlute" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 1  0 0.2 0 0 0.2  0 0 0.5 0 0.4  0 0 0 1.4 0" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Fundo do Ginásio Flat -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#gridPattern)" />

  <!-- Cenário do Ginásio Flat (Rack, Iluminação) -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="80" x2="120" y2="350" />
    <line x1="220" y1="80" x2="220" y2="350" />
    <line x1="100" y1="120" x2="240" y2="120" />
    <line x1="100" y1="200" x2="240" y2="200" />
    <line x1="680" y1="160" x2="680" y2="350" />
    <line x1="740" y1="160" x2="740" y2="350" />
    <line x1="660" y1="200" x2="760" y2="200" />
    <line x1="660" y1="260" x2="760" y2="260" />
    <line x1="660" y1="310" x2="760" y2="310" />
  </g>

  <!-- Piso Flat -->
  <polygon points="0,340 800,340 800,450 0,450" fill="url(#gymFloorGrad)" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#FF3377" stroke-width="2.5" opacity="0.5" />
  <line x1="220" y1="340" x2="140" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="440" y1="340" x2="420" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="620" y1="340" x2="680" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />

  <!-- Sombra no Chão sob a Atleta -->
  <ellipse cx="400" cy="348" rx="190" ry="14" fill="#120215" opacity="0.7" />

  <!-- Conteúdo do Exercício (Vetor Flat) -->
  <g id="illustration">
    
      <!-- Banco de Gym -->
      <rect x="190" y="240" width="120" height="95" rx="6" fill="#3D1242" stroke="#2B0B2E" stroke-width="3" />
      <line x1="205" y1="335" x2="205" y2="350" stroke="#1F0822" stroke-width="8" stroke-linecap="round" />
      <line x1="295" y1="335" x2="295" y2="350" stroke="#1F0822" stroke-width="8" stroke-linecap="round" />
      <rect x="180" y="235" width="140" height="20" rx="6" fill="#FF3377" opacity="0.8" />

      <!-- Corpo da Atleta (Posição de Hip Thrust) -->
      <!-- Cabeça e Pescoço (Olhando para frente/joelhos) -->
      <circle cx="270" cy="215" r="16" fill="#E8B088" />
      <!-- Cabelo Rabo de Cavalo -->
      <path d="M 260 200 C 275 195 285 205 280 225 C 275 235 255 240 250 230 Z" fill="#2E1B15" />
      <!-- Torso Inclinado Apoiado no Banco -->
      <line x1="280" y1="225" x2="380" y2="250" stroke="#0D9488" stroke-width="32" stroke-linecap="round" />
      
      <!-- Pélvis e Glúteo em Extensão 180° com Destaque Neon -->
      <g filter="url(#neonGlute)">
        <ellipse cx="395" cy="250" rx="34" ry="24" fill="#FF3377" />
        <path d="M 370 240 Q 405 235 425 255 Q 395 270 370 260 Z" fill="#FF0055" />
      </g>
      <text x="382" y="255" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">🍑</text>

      <!-- Coxas Horizontais Alinhadas -->
      <line x1="410" y1="250" x2="510" y2="250" stroke="#1F2937" stroke-width="26" stroke-linecap="round" />
      <!-- Joelhos a 90° e Canelas Verticais -->
      <line x1="510" y1="250" x2="510" y2="345" stroke="#1F2937" stroke-width="20" stroke-linecap="round" />
      <!-- Tênis / Pés Firmes no Chão -->
      <path d="M 495 345 L 535 345 L 530 335 L 505 335 Z" fill="#FFFFFF" stroke="#FF6B00" stroke-width="3" />

      <!-- Barra Olímpica e Anilhas de 25kg no Quadril -->
      <line x1="340" y1="235" x2="450" y2="235" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />
      <!-- Protetor de Barra Acolchoado -->
      <rect x="375" y="226" width="50" height="18" rx="5" fill="#FFE600" stroke="#2B0B2E" stroke-width="2" />
      <!-- Anilhas Pretas em Ambos os Lados -->
      <rect x="335" y="195" width="16" height="80" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2" />
      <circle cx="343" cy="235" r="5" fill="#94A3B8" />
      <!-- Braços Segurando a Barra -->
      <line x1="300" y1="225" x2="385" y2="235" stroke="#E8B088" stroke-width="12" stroke-linecap="round" />
      <circle cx="385" cy="235" r="8" fill="#E8B088" />

      <!-- Flecha Vetorial de Força Biomecânica -->
      <line x1="400" y1="285" x2="400" y2="220" stroke="#A7FF00" stroke-width="3" stroke-dasharray="4 2" />
      <polygon points="400,212 394,224 406,224" fill="#A7FF00" />
      <text x="415" y="222" fill="#A7FF00" font-family="sans-serif" font-size="11" font-weight="bold">EMPUJE TALÓN</text>
    
  </g>

  <!-- Top Badges Flat -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#2B0B2E" stroke="#FF3377" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#A7FF00" />
    <text x="28" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">ESTACIÓN 1 · GLÚTEO MAYOR</text>
  </g>

  <g transform="translate(630, 24)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#19041C" stroke="#FFE600" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#FF3377" filter="url(#neonGlute)" />
    <text x="28" y="18" fill="#FFE600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">GUÍA TÉCNICA FLAT</text>
  </g>

  <!-- Barra de Título Inferior Flat -->
  <g transform="translate(30, 412)">
    <rect x="0" y="-20" width="460" height="30" rx="8" fill="#18041B" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="14" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Hip Thrust con Pausa Isométrica 2s</text>
  </g>
</svg>