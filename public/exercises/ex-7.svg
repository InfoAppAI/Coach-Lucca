<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19041C" />
      <stop offset="50%" stop-color="#2B0B2E" />
      <stop offset="100%" stop-color="#140217" />
    </linearGradient>

    <linearGradient id="gymFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1242" />
      <stop offset="100%" stop-color="#1E0720" />
    </linearGradient>

    <filter id="neonGlute" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 1  0 0.2 0 0 0.2  0 0 0.5 0 0.4  0 0 0 1.4 0" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Fundo do Ginásio Flat -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#gridPattern)" />

  <!-- Cenário do Ginásio Flat (Rack, Iluminação) -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="80" x2="120" y2="350" />
    <line x1="220" y1="80" x2="220" y2="350" />
    <line x1="100" y1="120" x2="240" y2="120" />
    <line x1="100" y1="200" x2="240" y2="200" />
    <line x1="680" y1="160" x2="680" y2="350" />
    <line x1="740" y1="160" x2="740" y2="350" />
    <line x1="660" y1="200" x2="760" y2="200" />
    <line x1="660" y1="260" x2="760" y2="260" />
    <line x1="660" y1="310" x2="760" y2="310" />
  </g>

  <!-- Piso Flat -->
  <polygon points="0,340 800,340 800,450 0,450" fill="url(#gymFloorGrad)" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#FF3377" stroke-width="2.5" opacity="0.5" />
  <line x1="220" y1="340" x2="140" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="440" y1="340" x2="420" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="620" y1="340" x2="680" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />

  <!-- Sombra no Chão sob a Atleta -->
  <ellipse cx="400" cy="348" rx="190" ry="14" fill="#120215" opacity="0.7" />

  <!-- Conteúdo do Exercício (Vetor Flat) -->
  <g id="illustration">
    
      <!-- Cajón Pliométrico de Madera/Gym -->
      <rect x="420" y="240" width="130" height="105" rx="6" fill="#78350F" stroke="#B45309" stroke-width="3" />
      <line x1="440" y1="270" x2="530" y2="270" stroke="#D97706" stroke-width="2" />
      <line x1="440" y1="300" x2="530" y2="300" stroke="#D97706" stroke-width="2" />
      <rect x="410" y="235" width="150" height="16" rx="4" fill="#FFE600" opacity="0.9" />

      <!-- Pie de Arriba Apoyado en el Cajón -->
      <path d="M 450 235 L 490 235 L 485 225 L 460 225 Z" fill="#FFFFFF" stroke="#FF6B00" stroke-width="3" />
      <line x1="465" y1="230" x2="465" y2="175" stroke="#1F2937" stroke-width="22" stroke-linecap="round" />
      <line x1="465" y1="175" x2="385" y2="190" stroke="#1F2937" stroke-width="26" stroke-linecap="round" />

      <!-- Glúteo de Apoyo en Fuerte Contracción -->
      <g filter="url(#neonGlute)">
        <ellipse cx="380" cy="190" rx="34" ry="26" fill="#FF3377" />
        <path d="M 355 175 Q 395 170 415 195 Q 385 212 355 200 Z" fill="#FF0055" />
      </g>
      <text x="370" y="195" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">🍑</text>

      <!-- Torso Inclinado Cargando el Peso en el Talón Superior -->
      <line x1="375" y1="185" x2="425" y2="115" stroke="#F59E0B" stroke-width="28" stroke-linecap="round" />
      <circle cx="445" cy="95" r="16" fill="#E8B088" />
      <path d="M 435 80 C 450 75 460 85 455 105 C 450 115 430 120 425 110 Z" fill="#1C1917" />

      <!-- Pierna de Abajo Tocando Apenas el Suelo -->
      <line x1="365" y1="195" x2="330" y2="270" stroke="#111827" stroke-width="18" stroke-linecap="round" />
      <line x1="330" y1="270" x2="310" y2="345" stroke="#111827" stroke-width="16" stroke-linecap="round" />
      <circle cx="310" cy="345" r="6" fill="#FFFFFF" />

      <!-- Mancuernas en las Manos -->
      <line x1="420" y1="130" x2="420" y2="200" stroke="#E8B088" stroke-width="12" stroke-linecap="round" />
      <rect x="408" y="195" width="24" height="20" rx="3" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />

      <!-- Flecha de Impulso Desde el Talón -->
      <line x1="475" y1="260" x2="475" y2="190" stroke="#A7FF00" stroke-width="3" />
      <polygon points="475,182 469,194 481,194" fill="#A7FF00" />
      <text x="490" y="205" fill="#A7FF00" font-family="sans-serif" font-size="11" font-weight="bold">SUBIDA PURA</text>
    
  </g>

  <!-- Top Badges Flat -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#2B0B2E" stroke="#FF3377" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#A7FF00" />
    <text x="28" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">ESTACIÓN 7 · GLÚTEO MAYOR</text>
  </g>

  <g transform="translate(630, 24)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#19041C" stroke="#FFE600" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#FF3377" filter="url(#neonGlute)" />
    <text x="28" y="18" fill="#FFE600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">GUÍA TÉCNICA FLAT</text>
  </g>

  <!-- Barra de Título Inferior Flat -->
  <g transform="translate(30, 412)">
    <rect x="0" y="-20" width="460" height="30" rx="8" fill="#18041B" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="14" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Step-Up Alto en Cajón con Inclinación</text>
  </g>
</svg>