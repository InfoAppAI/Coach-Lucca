<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19041C" />
      <stop offset="50%" stop-color="#2B0B2E" />
      <stop offset="100%" stop-color="#140217" />
    </linearGradient>

    <linearGradient id="gymFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1242" />
      <stop offset="100%" stop-color="#1E0720" />
    </linearGradient>

    <filter id="neonGlute" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 1  0 0.2 0 0 0.2  0 0 0.5 0 0.4  0 0 0 1.4 0" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Fundo do Ginásio Flat -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#gridPattern)" />

  <!-- Cenário do Ginásio Flat (Rack, Iluminação) -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="80" x2="120" y2="350" />
    <line x1="220" y1="80" x2="220" y2="350" />
    <line x1="100" y1="120" x2="240" y2="120" />
    <line x1="100" y1="200" x2="240" y2="200" />
    <line x1="680" y1="160" x2="680" y2="350" />
    <line x1="740" y1="160" x2="740" y2="350" />
    <line x1="660" y1="200" x2="760" y2="200" />
    <line x1="660" y1="260" x2="760" y2="260" />
    <line x1="660" y1="310" x2="760" y2="310" />
  </g>

  <!-- Piso Flat -->
  <polygon points="0,340 800,340 800,450 0,450" fill="url(#gymFloorGrad)" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#FF3377" stroke-width="2.5" opacity="0.5" />
  <line x1="220" y1="340" x2="140" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="440" y1="340" x2="420" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="620" y1="340" x2="680" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />

  <!-- Sombra no Chão sob a Atleta -->
  <ellipse cx="400" cy="348" rx="190" ry="14" fill="#120215" opacity="0.7" />

  <!-- Conteúdo do Exercício (Vetor Flat) -->
  <g id="illustration">
    
      <!-- Banco Atrás -->
      <rect x="170" y="250" width="110" height="90" rx="5" fill="#3D1242" stroke="#2B0B2E" stroke-width="3" />
      <line x1="185" y1="340" x2="185" y2="350" stroke="#1F0822" stroke-width="8" stroke-linecap="round" />
      <line x1="265" y1="340" x2="265" y2="350" stroke="#1F0822" stroke-width="8" stroke-linecap="round" />
      <rect x="160" y="245" width="130" height="18" rx="4" fill="#FF3377" opacity="0.8" />

      <!-- Pierna Trasera con Empeine en Banco -->
      <ellipse cx="230" cy="245" rx="14" ry="8" fill="#FFFFFF" stroke="#FF6B00" stroke-width="2" />
      <line x1="240" y1="248" x2="330" y2="285" stroke="#111827" stroke-width="18" stroke-linecap="round" />
      <line x1="330" y1="285" x2="390" y2="225" stroke="#111827" stroke-width="22" stroke-linecap="round" />

      <!-- Tronco Inclinado a 30° Adelante -->
      <line x1="390" y1="225" x2="435" y2="150" stroke="#0284C7" stroke-width="28" stroke-linecap="round" />
      <!-- Cabeza Mirando en Diagonal al Frente -->
      <circle cx="455" cy="130" r="16" fill="#E8B088" />
      <path d="M 445 115 C 460 110 470 120 465 140 C 460 150 440 155 435 145 Z" fill="#1C1917" />

      <!-- Glúteo de la Pierna Adelantada (Tensión Excêntrica Máxima) -->
      <g filter="url(#neonGlute)">
        <ellipse cx="400" cy="225" rx="34" ry="26" fill="#FF3377" />
        <path d="M 375 210 Q 415 205 435 230 Q 405 248 375 235 Z" fill="#FF0055" />
      </g>
      <text x="390" y="230" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">🍑</text>

      <!-- Muslo Delantero Flexionado a 90° -->
      <line x1="410" y1="230" x2="490" y2="250" stroke="#1F2937" stroke-width="26" stroke-linecap="round" />
      <!-- Espinilla Delantera Vertical -->
      <line x1="490" y1="250" x2="490" y2="345" stroke="#1F2937" stroke-width="20" stroke-linecap="round" />
      <path d="M 475 345 L 515 345 L 510 335 L 485 335 Z" fill="#FFFFFF" stroke="#00F0FF" stroke-width="3" />

      <!-- Brazo con Mancuerna Pesada en la Mano -->
      <line x1="435" y1="160" x2="435" y2="245" stroke="#E8B088" stroke-width="12" stroke-linecap="round" />
      <rect x="420" y="240" width="30" height="22" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
      <text x="427" y="255" fill="#FFE600" font-family="sans-serif" font-size="9" font-weight="900">14K</text>

      <!-- Ángulo de Inclinación de 30° -->
      <line x1="390" y1="225" x2="390" y2="130" stroke="#FFE600" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
      <text x="375" y="170" fill="#FFE600" font-family="sans-serif" font-size="11" font-weight="bold">30° TORSO</text>
    
  </g>

  <!-- Top Badges Flat -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#2B0B2E" stroke="#FF3377" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#A7FF00" />
    <text x="28" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">ESTACIÓN 5 · GLÚTEO & FEMORAL</text>
  </g>

  <g transform="translate(630, 24)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#19041C" stroke="#FFE600" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#FF3377" filter="url(#neonGlute)" />
    <text x="28" y="18" fill="#FFE600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">GUÍA TÉCNICA FLAT</text>
  </g>

  <!-- Barra de Título Inferior Flat -->
  <g transform="translate(30, 412)">
    <rect x="0" y="-20" width="460" height="30" rx="8" fill="#18041B" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="14" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Sentadilla Búlgara Unilateral (Inclinación 30°)</text>
  </g>
</svg>