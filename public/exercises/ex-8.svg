<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19041C" />
      <stop offset="50%" stop-color="#2B0B2E" />
      <stop offset="100%" stop-color="#140217" />
    </linearGradient>

    <linearGradient id="gymFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1242" />
      <stop offset="100%" stop-color="#1E0720" />
    </linearGradient>

    <filter id="neonGlute" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 1  0 0.2 0 0 0.2  0 0 0.5 0 0.4  0 0 0 1.4 0" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Fundo do Ginásio Flat -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#gridPattern)" />

  <!-- Cenário do Ginásio Flat (Rack, Iluminação) -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="80" x2="120" y2="350" />
    <line x1="220" y1="80" x2="220" y2="350" />
    <line x1="100" y1="120" x2="240" y2="120" />
    <line x1="100" y1="200" x2="240" y2="200" />
    <line x1="680" y1="160" x2="680" y2="350" />
    <line x1="740" y1="160" x2="740" y2="350" />
    <line x1="660" y1="200" x2="760" y2="200" />
    <line x1="660" y1="260" x2="760" y2="260" />
    <line x1="660" y1="310" x2="760" y2="310" />
  </g>

  <!-- Piso Flat -->
  <polygon points="0,340 800,340 800,450 0,450" fill="url(#gymFloorGrad)" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#FF3377" stroke-width="2.5" opacity="0.5" />
  <line x1="220" y1="340" x2="140" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="440" y1="340" x2="420" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />
  <line x1="620" y1="340" x2="680" y2="450" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08" />

  <!-- Sombra no Chão sob a Atleta -->
  <ellipse cx="400" cy="348" rx="190" ry="14" fill="#120215" opacity="0.7" />

  <!-- Conteúdo do Exercício (Vetor Flat) -->
  <g id="illustration">
    
      <!-- Atleta em Sentadilla Sumo (Vista Frontal/Diagonal) -->
      <!-- Pés bem afastados além dos ombros -->
      <!-- Pé Esquerdo -->
      <path d="M 270 345 L 310 345 L 300 335 L 275 335 Z" fill="#FFFFFF" stroke="#FF6B00" stroke-width="3" transform="rotate(-25 290 345)" />
      <!-- Pé Direito -->
      <path d="M 490 345 L 530 345 L 525 335 L 500 335 Z" fill="#FFFFFF" stroke="#FF6B00" stroke-width="3" transform="rotate(25 510 345)" />

      <!-- Espinilhas Inclinadas Para Fora -->
      <line x1="290" y1="340" x2="330" y2="270" stroke="#1F2937" stroke-width="20" stroke-linecap="round" />
      <line x1="510" y1="340" x2="470" y2="270" stroke="#1F2937" stroke-width="20" stroke-linecap="round" />

      <!-- Coxas Abertas a 45° -->
      <line x1="330" y1="270" x2="390" y2="250" stroke="#1F2937" stroke-width="26" stroke-linecap="round" />
      <line x1="470" y1="270" x2="410" y2="250" stroke="#1F2937" stroke-width="26" stroke-linecap="round" />

      <!-- Glúteos em Posição Profunda com Glow Neon -->
      <g filter="url(#neonGlute)">
        <ellipse cx="400" cy="255" rx="38" ry="24" fill="#FF3377" />
        <path d="M 370 245 Q 400 240 430 245 Q 415 270 385 270 Z" fill="#FF0055" />
      </g>
      <text x="390" y="260" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">🍑</text>

      <!-- Torso Vertical Firme -->
      <line x1="400" y1="250" x2="400" y2="155" stroke="#6366F1" stroke-width="32" stroke-linecap="round" />
      <!-- Cabeça Alinhada -->
      <circle cx="400" cy="130" r="16" fill="#E8B088" />
      <path d="M 385 115 C 400 110 415 110 415 130 C 410 145 390 145 385 135 Z" fill="#1C1917" />

      <!-- Braços Estendidos Segurando Mancuerna Pesada Central -->
      <line x1="385" y1="160" x2="395" y2="260" stroke="#E8B088" stroke-width="12" stroke-linecap="round" />
      <line x1="415" y1="160" x2="405" y2="260" stroke="#E8B088" stroke-width="12" stroke-linecap="round" />

      <!-- Mancuerna Hexagonal Pesada Pendurada entre as Pernas -->
      <rect x="385" y="250" width="30" height="40" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
      <text x="390" y="275" fill="#FFE600" font-family="sans-serif" font-size="11" font-weight="900">24K</text>

      <!-- Indicadores de Abertura a 45° -->
      <text x="310" y="250" fill="#FFE600" font-family="sans-serif" font-size="11" font-weight="bold">45°</text>
      <text x="475" y="250" fill="#FFE600" font-family="sans-serif" font-size="11" font-weight="bold">45°</text>
    
  </g>

  <!-- Top Badges Flat -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#2B0B2E" stroke="#FF3377" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#A7FF00" />
    <text x="28" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">ESTACIÓN 8 · GLÚTEO & ADUCTORES</text>
  </g>

  <g transform="translate(630, 24)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#19041C" stroke="#FFE600" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4.5" fill="#FF3377" filter="url(#neonGlute)" />
    <text x="28" y="18" fill="#FFE600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">GUÍA TÉCNICA FLAT</text>
  </g>

  <!-- Barra de Título Inferior Flat -->
  <g transform="translate(30, 412)">
    <rect x="0" y="-20" width="460" height="30" rx="8" fill="#18041B" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="14" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Sentadilla Sumo Profunda con Mancuerna</text>
  </g>
</svg>